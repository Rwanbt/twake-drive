services:
  couchdb:
    # Pinned by digest: the same bytes on every run and on every machine.
    image: couchdb:3@sha256:4e8e0a366208a87d5059b0f4fcbefff13c32401a655d4629c19be6288ea77675
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "127.0.0.1:${COZY_E2E_COUCHDB_PORT:-15984}:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5984/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  cozystack:
    # Pinned by digest like the other images of the runtime: a run must not
    # silently test another revision of the Stack. Override it with
    # COZY_E2E_STACK_IMAGE to test a local build, and with
    # COZY_E2E_STACK_PULL_POLICY=never to keep it.
    image: ${COZY_E2E_STACK_IMAGE-cozy/cozy-stack@sha256:9916b218a11f6e5907613b64eb6bdf9011867647298d7daebb331135492e7120}
    pull_policy: ${COZY_E2E_STACK_PULL_POLICY:-always}
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COZY_ADMIN_PASSPHRASE: cozy
      COZY_COUCHDB_URL: http://admin:password@couchdb:5984/
      COZY_FS_URL: file:///var/lib/cozy/storage
      COZY_HOST: 0.0.0.0
      COZY_PORT: "${COZY_E2E_STACK_PORT:-18080}"
      COZY_ADMIN_HOST: 0.0.0.0
      COZY_ADMIN_PORT: "${COZY_E2E_ADMIN_PORT:-16060}"
      COZY_E2E_ROOT_DOMAIN: "${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}"
      COZY_CONTEXTS_DEFAULT_SHARING_TRUSTED_DOMAINS: "${COZY_E2E_ROOT_DOMAIN:-cozy.localhost},${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}:${COZY_E2E_STACK_PORT:-18080}"
      COZY_E2E_ONLYOFFICE_PORT: "${COZY_E2E_ONLYOFFICE_PORT:-18081}"
      COZY_E2E_ONLYOFFICE_JWT_SECRET: "${COZY_E2E_ONLYOFFICE_JWT_SECRET:-}"
      COZY_SUBDOMAINS: flat
    # Served from its directory: an app installed from file:// is reinstalled
    # by the stack on every load of its index page, one instance at a time.
    command: ["cozy-stack", "serve", "--dev", "--appdir", "drive:/app/drive"]
    volumes:
      - ./build:/app/drive
      - ./e2e/cozy.yml:/etc/cozy/cozy.yml
    ports:
      - "127.0.0.1:${COZY_E2E_STACK_PORT:-18080}:${COZY_E2E_STACK_PORT:-18080}"
      - "127.0.0.1:${COZY_E2E_ADMIN_PORT:-16060}:${COZY_E2E_ADMIN_PORT:-16060}"

  onlyoffice:
    image: onlyoffice/documentserver:9.4@sha256:e3da62a847b9a5d51a11f73cfea1d9c13c3be3809614490d4edddcf01dcf919b
    environment:
      JWT_ENABLED: "${COZY_E2E_ONLYOFFICE_JWT_ENABLED:-false}"
      JWT_SECRET: "${COZY_E2E_ONLYOFFICE_JWT_SECRET:-}"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
    volumes:
      # The scribe plugin of Drive, built by the global setup
      - ./plugins/onlyoffice-scribe/build:/var/www/onlyoffice/documentserver/sdkjs-plugins/twake-scribe:ro
    networks:
      - office
    healthcheck:
      test:
        ["CMD-SHELL", 'test "$(curl -fsS http://localhost/healthcheck)" = true']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  onlyoffice-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      onlyoffice:
        condition: service_healthy
    environment:
      COZY_E2E_ONLYOFFICE_PORT: "${COZY_E2E_ONLYOFFICE_PORT:-18081}"
      COZY_E2E_STACK_PORT: "${COZY_E2E_STACK_PORT:-18080}"
      NGINX_ENVSUBST_FILTER: "^COZY_E2E_(ONLYOFFICE|STACK)_PORT$"
    volumes:
      - ./e2e/onlyoffice-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${COZY_E2E_ONLYOFFICE_PORT:-18081}:${COZY_E2E_ONLYOFFICE_PORT:-18081}"
    networks:
      default:
        aliases:
          - onlyoffice.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
      office:
        # One Alice/Bob/Charlie trio per Playwright worker, up to MAX_WORKERS
        # in e2e/helpers/config.ts.
        aliases:
          - alice.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - bob.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - charlie.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - alice1.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - bob1.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - charlie1.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - alice2.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - bob2.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - charlie2.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - alice3.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - bob3.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
          - charlie3.${COZY_E2E_ROOT_DOMAIN:-cozy.localhost}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:${COZY_E2E_ONLYOFFICE_PORT:-18081}/healthcheck | grep -qx true",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  office:
